name: Version verification
on:
  push:
    branches: [main]
  pull_request:
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check SemVer consistency
        run: python tests/check_versioning.py
      - name: Test bump classification
        run: python -m unittest discover -s tests -p 'test_semver*.py'
